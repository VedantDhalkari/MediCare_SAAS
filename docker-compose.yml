version: '3.8'

services:
  # 1. PostgreSQL Database Service (Free Tier lightweight)
  postgres:
    image: postgres:15-alpine
    container_name: medicare_postgres
    restart: always
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Vloq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medicare_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicare_backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hospital_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-Vloq}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-medicare_super_secret_jwt_key_2026}
      NODE_ENV: production
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medicare_network

  # 3. User Frontend SPA (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: medicare_frontend
    restart: always
    networks:
      - medicare_network

  # 4. Admin Portal SPA (Vite + React)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: medicare_admin
    restart: always
    networks:
      - medicare_network

  # 5. Reverse Proxy Gateway (Nginx)
  proxy:
    image: nginx:alpine
    container_name: medicare_proxy
    restart: always
    ports:
      - "80:80"       # User Frontend & API
      - "8080:8080"   # Admin Portal & API
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - medicare_network

networks:
  medicare_network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
